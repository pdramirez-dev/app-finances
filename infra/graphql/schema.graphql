input PutCalendarEventInput {
  eventId: ID
  title: String!
  description: String
  startsAt: AWSDateTime!
  endsAt: AWSDateTime!
  timezone: String
  allDay: Boolean
  eventType: CalendarEventType
  ownerUserId: ID
  location: String
  clientId: ID
  contactId: ID
  opportunityId: ID
  projectId: ID
}

input RegisterPaymentInput {
  invoiceId: ID!
  bankAccountId: ID
  amount: Float!
  currency: String
  method: PaymentMethod!
  receivedAt: AWSDateTime
  reference: String!
  notes: String
}

input PutBankMovementInput {
  movementId: ID
  bankAccountId: ID
  externalId: String
  description: String!
  reference: String
  amount: Float!
  currency: String
  bookedOn: AWSDate!
  valueOn: AWSDate
  rawPayload: AWSJSON
}
